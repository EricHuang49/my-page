[build]
  command = """
    set -e
    echo "=== Starting Blog build process ==="
    echo "Node version: $(node --version)"
    echo "pnpm version: $(pnpm --version)"
    echo "Hugo version: $(hugo version)"
    echo "Go version: $(go version || echo 'Go not available')"
    
    echo "=== Installing dependencies ==="
    pnpm install --verbose --no-frozen-lockfile
    
    echo "=== Running Hugo build ==="
    hugo --gc --minify -b $URL --logLevel debug --printI18nWarnings --printPathWarnings
    
    echo "=== Running Pagefind indexing ==="
    pnpm run pagefind
    
    echo "=== Build completed successfully ==="
  """
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.162.0"
  GO_VERSION = "1.21.5"
  NODE_VERSION = "22"
  # Netlify runs an implicit install step; ensure it never enforces frozen lockfiles
  PNPM_FLAGS = "--no-frozen-lockfile"
  HUGO_ENABLEGITINFO = "true"
  HUGO_LOG_I18N_WARNINGS = "true"
  HUGO_LOG_WARNINGS = "true"
  FORCE_COLOR = "1"
  PNPM_LOG_LEVEL = "debug"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = """
    set -e
    echo "=== Deploy Preview Build ==="
    echo "Deploy URL: $DEPLOY_PRIME_URL"
    pnpm install --verbose --no-frozen-lockfile
    hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL --logLevel debug --printI18nWarnings --printPathWarnings
    pnpm run pagefind
  """

[context.branch-deploy]
  command = """
    set -e
    echo "=== Branch Deploy Build ==="
    echo "Deploy URL: $DEPLOY_PRIME_URL"
    pnpm install --verbose --no-frozen-lockfile
    hugo --gc --minify -b $DEPLOY_PRIME_URL --logLevel debug --printI18nWarnings --printPathWarnings
    pnpm run pagefind
  """

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true

# Redirects from the old site's URLs
[[redirects]]
  from = "/publication/unexpected_expenditure/exp_shock_paper.pdf"
  to = "/publications/unexpected-expenditure/exp_shock_paper.pdf"
  status = 301

[[redirects]]
  from = "/publication/precautionary_mismatch/Precautionary_Mismatch.pdf"
  to = "/publications/precautionary-mismatch/Precautionary_Mismatch.pdf"
  status = 301

[[redirects]]
  from = "/publication/precautionary_mismatch/*"
  to = "/publications/precautionary-mismatch/"
  status = 301

[[redirects]]
  from = "/publication/unexpected_expenditure/*"
  to = "/publications/unexpected-expenditure/"
  status = 301

[[redirects]]
  from = "/publication/*"
  to = "/#research"
  status = 301

[[redirects]]
  from = "/research/*"
  to = "/#research"
  status = 301

[[redirects]]
  from = "/research"
  to = "/#research"
  status = 301
